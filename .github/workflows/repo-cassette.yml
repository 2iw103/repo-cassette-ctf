name: Repo Cassette transport diagnostic

on:
  # Manual only: this diagnostic rewrites the current disposable job log.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  job-log-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: payload
        uses: ./artifact-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_LOG_PROBE: '1'

