name: Repo Cassette cross-job transport audit

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  race:
    name: race-${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        role: [v6, v7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./artifact-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLE: ${{ matrix.role }}

  cleanup:
    if: always()
    needs: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./artifact-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLE: cleanup
