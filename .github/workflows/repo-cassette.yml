name: Mint Repo Cassette payload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: payload
        uses: ./artifact-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEP_LOG_PROBE: '1'

