name: Repo Cassette one-time cleanup

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./artifact-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '40184193617'
