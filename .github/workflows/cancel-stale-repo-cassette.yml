name: Cancel stale Repo Cassette races

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-repo-cassette.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          for run_id in 40179176088 40179318352; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
