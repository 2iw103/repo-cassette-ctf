name: Repo Cassette v6-v7 race

on:
  push:
    paths:
      - 'race-action/**'
      - '.github/workflows/repo-cassette-race.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build-and-verify:
    name: race-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: race
        uses: ./race-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RACE_SHARD: ${{ matrix.shard }}
      - name: Record verified carrier
        run: |
          test -n "${{ steps.race.outputs.winner_artifact_id }}"
          echo "artifact_id=${{ steps.race.outputs.winner_artifact_id }}"
          echo "repository=${{ steps.race.outputs.winner_repository }}"
