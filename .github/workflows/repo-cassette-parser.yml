name: Repo Cassette last-mile diagnostic

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe invalid UTF-8 MIME and artifact-name redirects
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
