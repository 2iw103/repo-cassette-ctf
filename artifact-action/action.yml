name: Probe Repo Cassette transports
description: Reproduce GitHub transport behavior studied for Repo Cassette
outputs:
  artifact_id:
    description: Numeric GitHub Actions artifact ID
  repository_path:
    description: Value to pass as the challenge repository field
  payload_sha256:
    description: SHA-256 of the final raw artifact
  payload_base64:
    description: Exact final artifact body for the HAR response content
  live_check:
    description: REST body/hash and raw Content-Type verification result
runs:
  using: node20
  main: index.js

